sonar.organization=gogetenk
sonar.projectKey=gogetenk_vetolib-2

sonar.sources=src/
sonar.tests=tests/,src/frontend/e2e/

# Backend (.NET)
sonar.cs.opencover.reportsPaths=tests/**/coverage.opencover.xml

# Frontend (TypeScript/JavaScript)
sonar.typescript.lcov.reportPaths=src/frontend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/bin/**,**/obj/**,**/Migrations/**,**/wwwroot/**,**/playwright-report/**,**/test-results/**,**/*.generated.cs,**/*.feature.cs

sonar.test.exclusions=**/node_modules/**,**/.next/**

# Encoding
sonar.sourceEncoding=UTF-8
