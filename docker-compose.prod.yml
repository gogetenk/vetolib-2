# Production override for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# All sensitive values must be set as environment variables or in a .env file
# (see .env.example at the repository root). Never commit real secrets.

services:
  backend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=${JWT_SECRET}
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
      - ConnectionStrings__vetolibdb=${DATABASE_URL}
      - Cors__Origins=${CORS_ORIGINS}
      - Email__Provider=console
      - Sentry__Dsn=${SENTRY_DSN}

  frontend:
    environment:
      - NODE_ENV=production
