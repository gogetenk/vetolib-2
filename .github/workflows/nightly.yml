name: Nightly — Playwright E2E

on:
  schedule:
    # Every day at 02:00 UTC (06:00 Dubai time)
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: nightly-e2e
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Playwright E2E against MSW (no backend needed)
  # Moved from ci.yml — too slow for PR checks, runs nightly instead.
  # ─────────────────────────────────────────────────────────────────────────
  playwright-e2e:
    name: Playwright E2E (MSW)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (develop branch)
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend (production)
        working-directory: src/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

      - name: Run Playwright tests (MSW — no backend required)
        working-directory: src/frontend
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npx playwright test --config playwright.ci.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: src/frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-results
          path: src/frontend/test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # Notify on failure (GitHub Issues)
  # ─────────────────────────────────────────────────────────────────────────
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: playwright-e2e
    if: failure() || cancelled()

    steps:
      - name: Create GitHub issue on nightly failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly Playwright E2E failed — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              '## Nightly Playwright E2E failure',
              '',
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Branch:** develop`,
              `**Date:** ${new Date().toISOString()}`,
              '',
              'Please investigate the Playwright report artifact for details.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'ci'],
            });
