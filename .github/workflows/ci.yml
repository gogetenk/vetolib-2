name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend — build + unit tests (no external dependencies)
  # ─────────────────────────────────────────────────────────────────────────
  backend-build:
    name: Backend — build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        working-directory: src/backend
        run: dotnet restore Vetolib.sln

      - name: Build
        working-directory: src/backend
        run: dotnet build Vetolib.sln --no-restore -c Release

      - name: Unit tests
        working-directory: tests/Vetolib.Tests.Unit
        run: >
          dotnet test
          --no-build
          -c Release
          --logger "trx;LogFileName=unit-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: tests/Vetolib.Tests.Unit/TestResults/*.trx
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Backend — BDD / acceptance tests (Reqnroll + Testcontainers)
  # Testcontainers starts its own PostgreSQL container — no service: needed.
  # ─────────────────────────────────────────────────────────────────────────
  backend-bdd:
    name: Backend — BDD acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        working-directory: src/backend
        run: dotnet restore Vetolib.sln

      - name: Build (acceptance project)
        working-directory: tests/Vetolib.Tests.Acceptance
        run: dotnet build --no-restore -c Release

      - name: BDD tests (Testcontainers — Docker socket required)
        working-directory: tests/Vetolib.Tests.Acceptance
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: >
          dotnet test
          --no-build
          -c Release
          --logger "trx;LogFileName=bdd-results.trx"
          --results-directory ./TestResults
          --filter "Category!=wip"

      - name: Upload BDD test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-test-results
          path: tests/Vetolib.Tests.Acceptance/TestResults/*.trx
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Backend — integration tests (Testcontainers — Docker socket required)
  # Separate from BDD to allow parallel frontend jobs while this runs.
  # ─────────────────────────────────────────────────────────────────────────
  backend-integration:
    name: Backend — integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        working-directory: src/backend
        run: dotnet restore Vetolib.sln

      - name: Build (integration tests project)
        working-directory: tests/Vetolib.Tests.Integration
        run: dotnet build --no-restore -c Release

      - name: Integration tests (Testcontainers — Docker socket required)
        working-directory: tests/Vetolib.Tests.Integration
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: >
          dotnet test
          --no-build
          -c Release
          --logger "trx;LogFileName=integration-results.trx"
          --results-directory ./TestResults
          --filter "Category!=wip"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: tests/Vetolib.Tests.Integration/TestResults/*.trx
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — type-check, lint, Next.js build
  # ─────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint
        working-directory: src/frontend
        run: npm run lint

      - name: Build (validates TypeScript compilation + Next.js)
        working-directory: src/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

      - name: Upload Next.js build
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: src/frontend/.next/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — Playwright E2E against MSW (no backend needed)
  # DISABLED: too slow for PR CI — moved to nightly schedule.
  # See .github/workflows/nightly.yml for the scheduled Playwright runs.
  # ─────────────────────────────────────────────────────────────────────────
  frontend-e2e:
    if: false  # disabled — moved to .github/workflows/nightly.yml
    name: Frontend — Playwright E2E (MSW)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (MSW — no backend required)
        working-directory: src/frontend
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npx playwright test --config playwright.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: src/frontend/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Docker — verify images build correctly
  # Runs after backend-build and frontend-build both succeed.
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — build images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-build, frontend-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: false
          tags: vetolib-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          push: false
          tags: vetolib-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Code quality — dotnet format + TODO/FIXME/HACK scan (warning only)
  # Runs in parallel with other jobs — no dependencies.
  # ─────────────────────────────────────────────────────────────────────────
  code-quality:
    name: Code quality — format & TODO scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        working-directory: src/backend
        run: dotnet restore Vetolib.sln

      - name: Verify dotnet format (warn only, non-blocking)
        working-directory: src/backend
        continue-on-error: true
        run: dotnet format Vetolib.sln --verify-no-changes --verbosity diagnostic

      - name: Scan for TODO / FIXME / HACK (warning — non-blocking)
        run: |
          echo "## TODO/FIXME/HACK scan" >> $GITHUB_STEP_SUMMARY
          count=$(grep -rn --include="*.cs" --include="*.ts" --include="*.tsx" \
            -E "(TODO|FIXME|HACK)" src/ | wc -l)
          echo "Found ${count} occurrence(s)." >> $GITHUB_STEP_SUMMARY
          grep -rn --include="*.cs" --include="*.ts" --include="*.tsx" \
            -E "(TODO|FIXME|HACK)" src/ || true
          echo "Scan complete — ${count} occurrence(s) found (informational only)."

  # ─────────────────────────────────────────────────────────────────────────
  # Security scan — .NET CVE + npm audit
  # Runs in parallel — no dependencies.
  # ─────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security — CVE scan (.NET + npm)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore .NET packages
        working-directory: src/backend
        run: dotnet restore Vetolib.sln

      - name: Scan .NET packages for known vulnerabilities
        working-directory: src/backend
        run: |
          echo "## .NET vulnerability scan" >> $GITHUB_STEP_SUMMARY
          dotnet list Vetolib.sln package --vulnerable --include-transitive 2>&1 | tee /tmp/dotnet-audit.txt
          if grep -q "has the following vulnerable packages" /tmp/dotnet-audit.txt; then
            echo "::error::Vulnerable .NET packages detected — review dotnet-audit output above."
            exit 1
          fi
          echo "No vulnerable .NET packages found." >> $GITHUB_STEP_SUMMARY

      - name: Install npm dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Scan npm packages for high/critical vulnerabilities
        working-directory: src/frontend
        run: |
          echo "## npm vulnerability scan" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=high 2>&1 | tee /tmp/npm-audit.txt || {
            echo "::error::High or critical npm vulnerabilities detected — review npm-audit output above."
            cat /tmp/npm-audit.txt >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "No high/critical npm vulnerabilities found." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────
  # SonarCloud — static analysis (blocking on PRs, informational on push)
  # Uses dotnet-sonarscanner to wrap the .NET build for accurate analysis.
  # ─────────────────────────────────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud — static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true  # non-blocking: SONAR_TOKEN may not be configured

    steps:
      - name: Set up JDK 17 (required by SonarScanner)
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"

      - name: Checkout (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        working-directory: src/backend
        run: dotnet restore Vetolib.sln

      - name: SonarCloud — begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: src/backend
        run: >
          dotnet sonarscanner begin
          /k:"gogetenk_vetolib-2"
          /o:"gogetenk"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="../../tests/Vetolib.Tests.Unit/TestResults/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**"

      - name: Build (with coverage instrumentation)
        working-directory: src/backend
        run: dotnet build Vetolib.sln --no-restore -c Release

      - name: Unit tests with coverage
        working-directory: tests/Vetolib.Tests.Unit
        run: >
          dotnet test
          --no-build
          -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: SonarCloud — end analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: src/backend
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  # ─────────────────────────────────────────────────────────────────────────
  # Status check gate — required by branch protection rules.
  # Depends on ALL other jobs. If any job fails, this job fails too.
  # Configure your branch protection rule on this single job name.
  # ─────────────────────────────────────────────────────────────────────────
  status-check:
    name: Status check — all jobs green
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-build
      - backend-bdd
      - backend-integration
      - frontend-build
      # - frontend-e2e  # disabled — moved to .github/workflows/nightly.yml
      - docker-build
      - code-quality
      - security-scan
      - sonarcloud

    steps:
      - name: Verify all required jobs passed
        run: |
          # These jobs MUST succeed (never skipped)
          required=(
            "backend-build=${{ needs.backend-build.result }}"
            "backend-bdd=${{ needs.backend-bdd.result }}"
            "backend-integration=${{ needs.backend-integration.result }}"
            "frontend-build=${{ needs.frontend-build.result }}"
            "docker-build=${{ needs.docker-build.result }}"
            "code-quality=${{ needs.code-quality.result }}"
            "security-scan=${{ needs.security-scan.result }}"
          )
          # SonarCloud is non-blocking (continue-on-error: true) — any result is acceptable
          sonar="${{ needs.sonarcloud.result }}"

          failed=0
          for entry in "${required[@]}"; do
            name="${entry%%=*}"
            result="${entry##*=}"
            if [[ "$result" != "success" ]]; then
              echo "::error::${name} did not succeed (got: ${result})"
              failed=1
            fi
          done
          echo "sonarcloud result: ${sonar} (informational — non-blocking)"
          if [[ $failed -eq 1 ]]; then
            exit 1
          fi
          echo "All required jobs passed."
