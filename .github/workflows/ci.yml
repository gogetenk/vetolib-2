name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend — build + unit tests (no external dependencies)
  # ─────────────────────────────────────────────────────────────────────────
  backend-build:
    name: Backend — build & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: src/backend
        run: dotnet restore Vetolib.sln

      - name: Build
        working-directory: src/backend
        run: dotnet build Vetolib.sln --no-restore -c Release

      - name: Unit tests
        working-directory: tests/Vetolib.Tests.Unit
        run: >
          dotnet test
          --no-build
          -c Release
          --logger "trx;LogFileName=unit-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: tests/Vetolib.Tests.Unit/TestResults/*.trx
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Backend — BDD / acceptance tests (Reqnroll + Testcontainers)
  # Testcontainers starts its own PostgreSQL container — no service: needed.
  # ─────────────────────────────────────────────────────────────────────────
  backend-bdd:
    name: Backend — BDD acceptance tests
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: src/backend
        run: dotnet restore Vetolib.sln

      - name: Build (acceptance project)
        working-directory: tests/Vetolib.Tests.Acceptance
        run: dotnet build --no-restore -c Release

      - name: BDD tests (Testcontainers — Docker socket required)
        working-directory: tests/Vetolib.Tests.Acceptance
        env:
          # Testcontainers uses the Docker socket provided by the ubuntu runner
          DOCKER_HOST: unix:///var/run/docker.sock
        run: >
          dotnet test
          --no-build
          -c Release
          --logger "trx;LogFileName=bdd-results.trx"
          --results-directory ./TestResults

      - name: Upload BDD test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-test-results
          path: tests/Vetolib.Tests.Acceptance/TestResults/*.trx
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — type-check, lint, Next.js build
  # ─────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint
        working-directory: src/frontend
        run: npm run lint

      - name: Build (validates TypeScript compilation + Next.js)
        working-directory: src/frontend
        env:
          # Required by Next.js standalone build — dummy value acceptable in CI
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

      - name: Upload Next.js build
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: src/frontend/.next/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — Playwright E2E against MSW (no backend needed)
  # ─────────────────────────────────────────────────────────────────────────
  frontend-e2e:
    name: Frontend — Playwright E2E (MSW)
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (MSW — no backend required)
        working-directory: src/frontend
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npx playwright test --config playwright.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: src/frontend/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Docker — verify images build correctly
  # Runs after backend-build and frontend-build both succeed.
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: false
          tags: vetolib-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          push: false
          tags: vetolib-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max
