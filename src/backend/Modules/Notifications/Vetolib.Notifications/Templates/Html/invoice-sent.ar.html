<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فاتورة</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; direction: rtl;">
  <h1 style="color: #2c7a4b;">فاتورة من {{ClinicName}}</h1>
  <p>مرحباً {{OwnerName}}،</p>
  <p>يرجى الاطلاع على تفاصيل فاتورتك أدناه.</p>
  <table style="border-collapse: collapse; width: 100%; margin: 20px 0;">
    <tr>
      <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">رقم الفاتورة</td>
      <td style="padding: 8px; border: 1px solid #ddd;">{{InvoiceNumber}}</td>
    </tr>
    <tr>
      <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">المبلغ الإجمالي</td>
      <td style="padding: 8px; border: 1px solid #ddd;">{{TotalAmount}} {{Currency}}</td>
    </tr>
  </table>
  <p>شكراً لثقتكم في رعاية حيواناتكم الأليفة.</p>
  <p>مع أطيب التحيات،<br/><strong>{{ClinicName}}</strong></p>
</body>
</html>
