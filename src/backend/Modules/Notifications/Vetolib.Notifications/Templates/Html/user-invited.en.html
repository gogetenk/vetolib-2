<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to {{ClinicName}}</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h1 style="color: #2c7a4b;">Welcome to {{ClinicName}}</h1>
  <p>Your account has been created.</p>
  <table style="border-collapse: collapse; width: 100%; margin: 20px 0;">
    <tr>
      <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">Email</td>
      <td style="padding: 8px; border: 1px solid #ddd;">{{Email}}</td>
    </tr>
    <tr>
      <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">Temporary password</td>
      <td style="padding: 8px; border: 1px solid #ddd;"><strong>{{TemporaryPassword}}</strong></td>
    </tr>
  </table>
  <p>Please change your password after first login.</p>
  <p>Best regards,<br/><strong>{{ClinicName}}</strong></p>
</body>
</html>
