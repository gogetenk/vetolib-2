<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h1 style="color: #2c7a4b;">Invoice from {{ClinicName}}</h1>
  <p>Hello {{OwnerName}},</p>
  <p>Please find your invoice details below.</p>
  <table style="border-collapse: collapse; width: 100%; margin: 20px 0;">
    <tr>
      <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">Invoice Number</td>
      <td style="padding: 8px; border: 1px solid #ddd;">{{InvoiceNumber}}</td>
    </tr>
    <tr>
      <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">Total Amount</td>
      <td style="padding: 8px; border: 1px solid #ddd;">{{TotalAmount}} {{Currency}}</td>
    </tr>
  </table>
  <p>Thank you for trusting us with your pet's care.</p>
  <p>Best regards,<br/><strong>{{ClinicName}}</strong></p>
</body>
</html>
