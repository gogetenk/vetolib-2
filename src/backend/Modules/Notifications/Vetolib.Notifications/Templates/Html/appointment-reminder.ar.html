<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تذكير بالموعد</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; direction: rtl;">
  <h1 style="color: #2c7a4b;">تذكير بالموعد — {{ClinicName}}</h1>
  <p>مرحباً {{OwnerName}}،</p>
  <p>هذا تذكير بأن <strong>{{PatientName}}</strong> لديه موعد غداً.</p>
  <table style="border-collapse: collapse; width: 100%; margin: 20px 0;">
    <tr>
      <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">التاريخ والوقت</td>
      <td style="padding: 8px; border: 1px solid #ddd;">{{DateTime}}</td>
    </tr>
    <tr>
      <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">الطبيب البيطري</td>
      <td style="padding: 8px; border: 1px solid #ddd;">{{VetName}}</td>
    </tr>
  </table>
  <p>إذا كنت بحاجة إلى إعادة الجدولة أو الإلغاء، يرجى الاتصال بنا في أقرب وقت ممكن.</p>
  <p>مع أطيب التحيات،<br/><strong>{{ClinicName}}</strong></p>
</body>
</html>
