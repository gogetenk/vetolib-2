<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointment Reminder</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h1 style="color: #2c7a4b;">Appointment Reminder — {{ClinicName}}</h1>
  <p>Hello {{OwnerName}},</p>
  <p>This is a reminder that <strong>{{PatientName}}</strong> has an appointment tomorrow.</p>
  <table style="border-collapse: collapse; width: 100%; margin: 20px 0;">
    <tr>
      <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">Date &amp; Time</td>
      <td style="padding: 8px; border: 1px solid #ddd;">{{DateTime}}</td>
    </tr>
    <tr>
      <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">Veterinarian</td>
      <td style="padding: 8px; border: 1px solid #ddd;">{{VetName}}</td>
    </tr>
  </table>
  <p>If you need to reschedule or cancel, please contact us as soon as possible.</p>
  <p>Best regards,<br/><strong>{{ClinicName}}</strong></p>
</body>
</html>
