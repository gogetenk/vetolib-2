<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460">
  <rect width="720" height="460" fill="#f0fdf4"/>
  <!-- Header bar -->
  <rect x="0" y="0" width="720" height="48" fill="#065f46"/>
  <text x="24" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="white">Vetara</text>
  <rect x="580" y="12" width="120" height="24" rx="4" fill="#10b981"/>
  <text x="640" y="28" font-family="system-ui, sans-serif" font-size="11" fill="white" text-anchor="middle">New Appointment</text>

  <!-- Sidebar -->
  <rect x="0" y="48" width="180" height="412" fill="#f9fafb"/>
  <rect x="12" y="68" width="156" height="32" rx="6" fill="#d1fae5"/>
  <text x="44" y="88" font-family="system-ui, sans-serif" font-size="13" fill="#065f46" font-weight="600">Dashboard</text>
  <text x="44" y="120" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Appointments</text>
  <text x="44" y="148" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Patients</text>
  <text x="44" y="176" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Billing</text>
  <text x="44" y="204" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Team</text>

  <!-- Main content -->
  <rect x="196" y="64" width="508" height="100" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="216" y="90" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Today's appointments</text>
  <text x="216" y="120" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#111827">12</text>
  <text x="216" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#10b981">+3 from yesterday</text>

  <!-- Stats row -->
  <rect x="196" y="180" width="160" height="80" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="212" y="206" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">Patients</text>
  <text x="212" y="238" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#111827">243</text>

  <rect x="370" y="180" width="160" height="80" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="386" y="206" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">Unpaid invoices</text>
  <text x="386" y="238" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#111827">5</text>

  <rect x="544" y="180" width="160" height="80" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="560" y="206" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">Revenue (AED)</text>
  <text x="560" y="238" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#111827">18,450</text>

  <!-- Appointments table -->
  <rect x="196" y="276" width="508" height="180" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="212" y="302" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#111827">Upcoming appointments</text>
  <line x1="196" y1="316" x2="704" y2="316" stroke="#f3f4f6" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="212" y="338" font-family="system-ui, sans-serif" font-size="12" fill="#374151">09:00</text>
  <text x="280" y="338" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Luna — Cat</text>
  <text x="430" y="338" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Fatima Al-Hashimi</text>
  <rect x="590" y="326" width="64" height="20" rx="10" fill="#d1fae5"/>
  <text x="622" y="339" font-family="system-ui, sans-serif" font-size="10" fill="#065f46" text-anchor="middle">Scheduled</text>

  <!-- Row 2 -->
  <text x="212" y="366" font-family="system-ui, sans-serif" font-size="12" fill="#374151">10:30</text>
  <text x="280" y="366" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Max — Dog</text>
  <text x="430" y="366" font-family="system-ui, sans-serif" font-size="12" fill="#374151">James Mitchell</text>
  <rect x="590" y="354" width="64" height="20" rx="10" fill="#fef3c7"/>
  <text x="622" y="367" font-family="system-ui, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Checked In</text>

  <!-- Row 3 -->
  <text x="212" y="394" font-family="system-ui, sans-serif" font-size="12" fill="#374151">11:00</text>
  <text x="280" y="394" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Noor — Rabbit</text>
  <text x="430" y="394" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Ahmed Al-Mansoori</text>
  <rect x="590" y="382" width="64" height="20" rx="10" fill="#dbeafe"/>
  <text x="622" y="395" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">In Progress</text>
</svg>
